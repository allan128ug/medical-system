<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allan Editable</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head><body class="bg-slate-50"><div class="flex"><div class="w-60 bg-[#0a1f23] text-slate-300 p-4 fixed h-full"><div class="text-white font-bold mb-6">ALLAN MEDICAL<br><span class="text-[10px] text-slate-400">EDITABLE</span></div><button onclick="show('ov')" class="w-full text-left px-3 py-2 bg-[#12343a] text-white rounded mb-1" id="b-ov">Overview</button><button onclick="show('inv')" class="w-full text-left px-3 py-2 hover:text-white" id="b-inv">Inventory EDIT</button><button onclick="show('sal')" class="w-full text-left px-3 py-2 hover:text-white" id="b-sal">Sales EDIT</button><button onclick="show('pat')" class="w-full text-left px-3 py-2 hover:text-white" id="b-pat">Patients EDIT</button></div><div class="flex-1 ml-60 p-6"><div id="ov"><h1 class="text-2xl font-bold">Dashboard 28 Oct 2026 - EDITABLE READY</h1><div class="grid grid-cols-4 gap-3 mt-6"><div class="bg-amber-50 p-4 rounded-xl border"><p class="text-[11px]">Sales</p><p class="font-bold text-xl mt-1" id="s1">0</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-[11px]">Trans</p><p class="font-bold text-xl mt-1" id="s2">0</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-[11px]">Stock</p><p class="font-bold text-xl mt-1" id="s3">0</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-[11px]">Patients</p><p class="font-bold text-xl mt-1" id="s4">0</p></div></div></div><div id="inv" class="hidden"><div class="flex justify-between"><h2 class="font-bold text-xl">Inventory - EDIT / DELETE</h2><button onclick="addM()" class="bg-black text-white px-4 py-2 rounded">Add Med</button></div><div class="bg-white mt-4 rounded-xl border"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th>Stock</th><th>Price</th><th>Action</th></tr></thead><tbody id="ib"></tbody></table></div></div><div id="sal" class="hidden"><div class="flex justify-between"><h2 class="font-bold text-xl">Sales - EDITABLE</h2><button onclick="addS()" class="bg-emerald-600 text-white px-4 py-2 rounded">New Sale</button></div><div class="bg-white mt-4 rounded-xl border"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Date</th><th>Med</th><th>Qty</th><th>Total</th><th>Action</th></tr></thead><tbody id="sb"></tbody></table></div></div><div id="pat" class="hidden"><div class="flex justify-between"><h2 class="font-bold text-xl">Patients - EDITABLE</h2><button onclick="addP()" class="bg-black text-white px-4 py-2 rounded">Add Patient</button></div><div class="bg-white mt-4 rounded-xl border"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th>Room</th><th>Doctor</th><th>Disease</th><th>Bills</th><th>Action</th></tr></thead><tbody id="pb"></tbody></table></div></div></div></div><script>
let inv=JSON.parse(localStorage.getItem('inv')||'[]'),sales=JSON.parse(localStorage.getItem('sales')||'[]'),pats=JSON.parse(localStorage.getItem('pats')||'[]');
if(!inv.length) inv=[{name:'Paracetamol',stock:120,price:500},{name:'Amoxicillin',stock:80,price:1500},{name:'Cetirizine',stock:12,price:800}];
if(!pats.length) pats=[{name:'ALLAN',room:101,doctor:'VANESA',disease:'MALARIA',bills:3000000},{name:'AMON',room:102,doctor:'BOB',disease:'FEVER',bills:3000001},{name:'MBABAZI',room:103,doctor:'CAIY',disease:'UTIS',bills:3000002}];
function save(){localStorage.setItem('inv',JSON.stringify(inv));localStorage.setItem('sales',JSON.stringify(sales));localStorage.setItem('pats',JSON.stringify(pats));render();}
function show(p){['ov','inv','sal','pat'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(p).classList.remove('hidden');}
function render(){document.getElementById('ib').innerHTML=inv.map((m,i)=>`<tr class="border-t"><td class="p-3">${m.name}</td><td class="text-center">${m.stock}</td><td class="text-center">${m.price}</td><td class="text-center"><button onclick="editM(${i})" class="text-blue-600 mr-2">EDIT</button><button onclick="inv.splice(${i},1);save()" class="text-red-600">DEL</button></td></tr>`).join('');document.getElementById('sb').innerHTML=sales.map((s,i)=>`<tr class="border-t"><td class="p-3">${s.date}</td><td>${s.med}</td><td class="text-center">${s.qty}</td><td>${s.total}</td><td class="text-center"><button onclick="let id=inv.findIndex(m=>m.name===sales[${i}].med);if(id>-1)inv[id].stock+=sales[${i}].qty;sales.splice(${i},1);save()" class="text-red-600">DEL</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-4 text-center">No sales</td></tr>';document.getElementById('pb').innerHTML=pats.map((p,i)=>`<tr class="border-t"><td class="p-3 font-bold">${p.name}</td><td class="text-center">${p.room}</td><td>${p.doctor}</td><td>${p.disease}</td><td>${p.bills}</td><td class="text-center"><button onclick="editP(${i})" class="text-blue-600 mr-2">EDIT</button><button onclick="pats.splice(${i},1);save()" class="text-red-600">DEL</button></td></tr>`).join('');document.getElementById('s1').innerText=sales.reduce((a,b)=>a+b.total,0);document.getElementById('s2').innerText=sales.length;document.getElementById('s3').innerText=inv.reduce((a,b)=>a+b.stock,0);document.getElementById('s4').innerText=pats.length;}
function addM(){let n=prompt('Medicine name:');if(!n)return;let s=prompt('Stock:','50');let p=prompt('Price:','1000');inv.push({name:n,stock:parseInt(s),price:parseInt(p)});save();}
function editM(i){let m=inv[i];let n=prompt('Edit name:',m.name);if(n)m.name=n;let s=prompt('Edit stock:',m.stock);if(s)m.stock=parseInt(s);let p=prompt('Edit price:',m.price);if(p)m.price=parseInt(p);save();}
function addS(){let l=inv.map((m,i)=>i+': '+m.name+' ('+m.stock+')').join('\n');let id=parseInt(prompt('Pick number:\n'+l));let q=parseInt(prompt('Qty:','1'));if(inv[id].stock<q)return alert('Low stock');inv[id].stock-=q;sales.push({date:new Date().toLocaleDateString(),med:inv[id].name,qty:q,total:inv[id].price*q});save();}
function addP(){let n=prompt('Name:');if(!n)return;let r=prompt('Room:');let d=prompt('Doctor:');let dis=prompt('Disease:');let b=prompt('Bills:');pats.push({name:n.toUpperCase(),room:r,doctor:d,disease:dis,bills:b});save();}
function editP(i){let p=pats[i];let n=prompt('Edit name:',p.name);if(n)p.name=n.toUpperCase();let r=prompt('Room:',p.room);if(r)p.room=r;let d=prompt('Doctor:',p.doctor);if(d)p.doctor=d;let dis=prompt('Disease:',p.disease);if(dis)p.disease=dis;let b=prompt('Bills:',p.bills);if(b)p.bills=b;save();}
render();
</script></body></html>
